name: DonnyBoy Android
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: donnyboy-android
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Importovat a upravit zdroj
        run: |
          test -f tool/donnyboy/bootstrap.py
          python3 tool/donnyboy/bootstrap.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Kontrola
        run: |
          flutter analyze --no-pub
          flutter test --no-pub test/donnyboy_test.dart
      - name: Sestavit APK
        run: flutter build apk --release --build-name=0.1.0 --build-number=${{ github.run_number }}
      - name: Overit APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DonnyBoy-0.1.0-preview.apk
          unzip -l dist/DonnyBoy-0.1.0-preview.apk | grep libapp.so
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: DonnyBoy-0.1.0-preview
          path: dist/*
          if-no-files-found: error
      - name: Vydat testovaci APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-preview-${{ github.run_number }}"
          gh release create "$tag" dist/* --target "$(git rev-parse HEAD)" --prerelease --title "DonnyBoy 0.1.0 preview" --notes "Testovací release sestavený v režimu release s vývojovým podpisem. Není určený pro Google Play. Zdroj: větev dev. BLE/USB vyžaduje ověření na fyzickém zařízení."
