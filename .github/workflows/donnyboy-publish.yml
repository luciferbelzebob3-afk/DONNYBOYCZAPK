name: DonnyBoy publish verified APK
on:
  push:
    branches: [dev]
    paths: ['tool/donnyboy/publish-request.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: donnyboy-official-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Overit puvod sestaveneho APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tool/donnyboy -p test_verify_signature.py
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          request = json.loads(Path('tool/donnyboy/publish-request.json').read_text())
          api = lambda suffix: json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/{suffix}']))
          run = api(f'actions/runs/{request["run_id"]}')
          assert run['head_sha'] == request['source_commit'], 'Nesouhlasí zdrojový commit'
          assert run['name'] == 'DonnyBoy official release'
          jobs = api(f'actions/runs/{request["run_id"]}/jobs')['jobs']
          steps = {s['name']: s['conclusion'] for j in jobs for s in j['steps']}
          for name in ['Analyza a testy', 'Sestavit podepsany release']:
              assert steps.get(name) == 'success', f'Neprošla povinná kontrola: {name}'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'RELEASE_VERSION={request["version"]}\nSOURCE_COMMIT={request["source_commit"]}\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: DonnyBoy-release
          path: dist
          github-token: ${{ github.token }}
          run-id: 44005435723
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Overit APK a podpis
        run: |
          apk="dist/DonnyBoy-$RELEASE_VERSION.apk"
          unzip -t "$apk" > /dev/null
          unzip -l "$apk" | grep libapp.so
          unzip -l "$apk" | grep assets/flutter_assets/assets/img/donnyboy_logo.png
          unzip -l "$apk" | grep assets/flutter_assets/assets/img/donnyboy_icon.png
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" > dist/APK-SIGNATURE.txt
          cat dist/APK-SIGNATURE.txt
          expected=$(openssl x509 -in dist/DonnyBoy-signing-certificate.pem -outform DER | sha256sum | cut -d' ' -f1)
          python3 tool/donnyboy/verify_signature.py dist/APK-SIGNATURE.txt "$expected"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Vydat APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" "dist/DonnyBoy-$RELEASE_VERSION.apk" \
            dist/SHA256SUMS dist/APK-SIGNATURE.txt dist/DonnyBoy-signing-certificate.pem dist/DonnyBoy-signing.cms \
            --target "$SOURCE_COMMIT" --title "DonnyBoy $RELEASE_VERSION" --notes-file tool/donnyboy/release-notes.md
